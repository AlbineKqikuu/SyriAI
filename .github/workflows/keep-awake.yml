# Keeps the free Render service awake: it sleeps after 15 minutes without visitors and the
# next visit then waits about a minute. A request every 10 minutes prevents that.
# One service running all month uses ~744 of the 750 free instance hours.
name: Keep Render awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: curl --silent --show-error --fail --retry 3 --retry-delay 20 --max-time 90 https://syriai.onrender.com/healthz
